name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  F1_THRESHOLD: "0.65"
  AWS_DEFAULT_REGION: ap-southeast-1

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Model duoc upload vao artifacts/candidate/ - chi duoc dua sang artifacts/current/
  # o job Release, sau khi qua quality gate.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS = {"aws_access_key_id": "...", "aws_secret_access_key": "..."}
        # (access key cua IAM user income-lab-sa, chi co quyen tren dung bucket cua lab).
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(jq -r .aws_access_key_id <<< "$STORAGE_CREDENTIALS")
          SECRET=$(jq -r .aws_secret_access_key <<< "$STORAGE_CREDENTIALS")
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"

      - name: Configure MLflow tracking
        # Bonus 1: neu co secret MLFLOW_TRACKING_URI (vd DagsHub) thi ghi len server tu xa,
        # nguoc lai dung SQLite cuc bo tren runner.
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if [ -n "$MLFLOW_TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_USERNAME=$MLFLOW_TRACKING_USERNAME" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_PASSWORD=$MLFLOW_TRACKING_PASSWORD" >> "$GITHUB_ENV"
            echo "MLflow: dung tracking server tu xa."
          else
            echo "MLflow: dung SQLite cuc bo (sqlite:///mlflow.db)."
          fi

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Precision / recall report
        # Bonus 3: confusion matrix + precision/recall tung lop -> outputs/detail.txt
        run: python src/evaluate.py

      - name: Upload candidate model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          for local, key in [
              ("models/model.joblib", "artifacts/candidate/model.joblib"),
              ("outputs/report.json", "artifacts/candidate/report.json"),
          ]:
              s3.upload_file(local, bucket, key)
              print(f"Uploaded {local} -> s3://{bucket}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          # GitHub Actions outputs la chuoi -> phai ep kieu float truoc khi so sanh.
          f1 = float(os.environ["F1"])
          threshold = float(os.environ["F1_THRESHOLD"])
          print(f"f1_score = {f1:.4f}, nguong = {threshold}")
          if f1 < threshold:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {threshold}. Huy trien khai.")
          print("PASSED: dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Bonus 4: so sanh F1 moi voi F1 cua model dang phuc vu (artifacts/current/report.json).
  # Chi dua model candidate len artifacts/current/ va restart VM khi F1 moi >= F1 cu.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install boto3==1.34.131

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS = {"aws_access_key_id": "...", "aws_secret_access_key": "..."}
        # (access key cua IAM user income-lab-sa, chi co quyen tren dung bucket cua lab).
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          KEY_ID=$(jq -r .aws_access_key_id <<< "$STORAGE_CREDENTIALS")
          SECRET=$(jq -r .aws_secret_access_key <<< "$STORAGE_CREDENTIALS")
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          echo "AWS_ACCESS_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"

      - name: Compare with current model and promote
        id: promote
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")

          def read_report(key):
              try:
                  return json.loads(s3.get_object(Bucket=bucket, Key=key)["Body"].read())
              except s3.exceptions.NoSuchKey:
                  return None

          new = read_report("artifacts/candidate/report.json")
          old = read_report("artifacts/current/report.json")

          if old is not None:
              print(f"F1 model dang chay : {old['f1_score']:.4f}")
              print(f"F1 model moi       : {new['f1_score']:.4f}")
              deploy = new["f1_score"] >= old["f1_score"]
          else:
              print("Chua co model dang chay -> trien khai lan dau.")
              deploy = True

          if deploy:
              for name in ["model.joblib", "report.json"]:
                  s3.copy_object(
                      Bucket=bucket,
                      Key=f"artifacts/current/{name}",
                      CopySource={"Bucket": bucket, "Key": f"artifacts/candidate/{name}"},
                  )
              print("DEPLOY: da dua model moi len artifacts/current/.")
          else:
              print("ROLLBACK: F1 moi thap hon F1 cu -> giu nguyen model dang chay, khong trien khai.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"deploy={'true' if deploy else 'false'}\n")
          PYEOF

      - name: SSH deploy to VM
        if: steps.promote.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            # Server tai model tu cloud storage khi khoi dong -> thu lai toi da 12 lan x 5 giay.
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed."
                exit 0
              fi
              echo "Lan thu $i: server chua san sang..."
            done
            echo "Health check FAILED."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
